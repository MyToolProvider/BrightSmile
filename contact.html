<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<title>Contact · BrightSmile Dental</title>
</head>
<body>
<section class="page-hero"><canvas id="orb-canvas" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
<div class="hero-content">
  <span class="eyebrow reveal">Contact</span>
  <h1 class="reveal reveal-delay-1">We're here to <span class="gradient-text">help.</span></h1>
  <p class="lead reveal reveal-delay-2">120 Harbor Street · care@brightsmiledental.com · +1 (555) 044-8120</p>
</div></section>
<section>
  <div class="grid">
    <div class="card reveal"><div class="icon">🕒</div><h3>Opening hours</h3><p>Mon–Fri 8am–6pm<br>Sat 9am–2pm<br>Emergency line 24/7</p></div>
    <div class="card reveal reveal-delay-1"><div class="icon">🚗</div><h3>Getting here</h3><p>Free parking behind the clinic and step-free access on the ground floor.</p></div>
  </div>
  <div class="card reveal" style="max-width:820px;margin:40px auto 0">
    <form id="contactForm">
      <div class="form-row"><input type="text" placeholder="Name" required><input type="email" placeholder="Email" required></div>
      <textarea placeholder="Your message" required></textarea>
      <button class="btn btn-primary" type="submit" style="justify-self:start">Send message →</button>
    </form>
  </div>
</section>
<script>
document.getElementById("contactForm").addEventListener("submit", (e) => {
  e.preventDefault(); window.toast("Thanks! We'll be in touch."); e.target.reset();
});
</script>
<script src="main.js"></script>
</body>
</html>
